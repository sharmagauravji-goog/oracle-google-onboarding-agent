# Sample GitHub Actions Workflow for Oracle Database@Google Cloud Deployment
# Generated by the Oracle Database@Google Cloud Onboarding & Infrastructure Agent

name: "Sample Deploy - Oracle Database@Google Cloud"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  validate-agent-and-templates:
    name: "Run Agent Unit Tests & Validate Generated HCL"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run Pytest Suite
        run: .venv/bin/pytest -v
